# Example reverse proxy for production. Replace domain and filesystem paths.
# Django owns /api/, /admin/, SEO product/category routes and authentication.
upstream wallboard_django {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name example.com www.example.com;
    root /var/www/wallboard/developer-source/dist;
    index index.html;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://wallboard_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The production admin is Django Admin, never the browser-local prototype.
    location /admin/ {
        proxy_pass http://wallboard_django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /var/www/wallboard/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /static/ {
        alias /var/www/wallboard/django-static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Vite output uses content-hashed files under /assets/, safe for immutable caching.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Unmatched SEO routes (for example /products/<slug>/) are rendered by Django.
    location /products/ {
        proxy_pass http://wallboard_django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /categories/ {
        proxy_pass http://wallboard_django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ @wallboard_django;
    }

    location @wallboard_django {
        proxy_pass http://wallboard_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/manifest+json image/svg+xml;
}
